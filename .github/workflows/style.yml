name: Styling with ESLint + Prettier

on:
  pull_request:
    branches:
      - main
      - developer

jobs:
  style:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.PAT }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'

      - name: Install Dependencies
        run: npm ci

      - name: Format && Lint
        run: npm run style

      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Refactor: Fix code style'
          commit_options: '--no-verify'
