name: Testing with Vitest + Playwright
on:
    pull_request:
        branches:
            - main
            - developer

jobs:
    unit:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v6

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 'lts/*'

            - name: Install Dependencies
              run: npm ci

            - name: Run Unit Tests
              run: npm run test

    e2e:
        timeout-minutes: 60
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v6

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 'lts/*'

            - name: Install Dependencies
              run: npm ci

            - name: Install Playwright Browsers
              run: npx playwright install --with-deps

            - name: Run End-to-End Tests
              run: npm run test:e2e
